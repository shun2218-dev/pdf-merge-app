
name: Unit Tests
on:
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.11.0"
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run unit tests
        id: unit-test
        continue-on-error: true
        run: pnpm run test:unit
      - name: Parse Coverage Summary
        id: coverage-summary
        if: always()
        run: |
          echo "COVERAGE_PERCENT=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)" >> $GITHUB_OUTPUT
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage-report
          path: coverage/
          retention-days: 30
      - name: Post Unit Test Comment
        uses: peter-evans/create-or-update-comment@v4
        if: always() && github.event_name == 'pull_request'
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### 🤖 ユニットテスト (Vitest) が完了しました

            - **結果:** ${{ steps.unit-test.outcome == 'success' && '✅ 成功' || '❌ 失敗' }}
            - **カバレッジ (Lines):** `${{ steps.coverage-summary.outputs.COVERAGE_PERCENT }}%`

            [詳細なHTMLレポートはこちら (要ログイン)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)
            *(上記リンク先の "vitest-coverage-report" をダウンロードしてください)*