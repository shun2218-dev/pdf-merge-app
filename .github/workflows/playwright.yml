name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  permissions:
      pull-requests: write
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "24.11.0"
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Build Next.js App
      run: pnpm run build
    - name: Run Playwright tests
      run: pnpm run test:e2e
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Post E2E Test Comment
      uses: peter-evans/create-or-update-comment@v4
      if: always() && github.event_name == 'pull_request'
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          ### 🤖 E2E テスト (Playwright) が完了しました

          - **結果:** ${{ steps.playwright-test.outcome == 'success' && '✅ 成功' || '❌ 失敗' }}

          [詳細なHTMLレポートはこちら (要ログイン)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)
          *(上記リンク先の "playwright-report" をダウンロードしてください)*