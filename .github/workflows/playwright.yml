name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v5
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "24.11.0"
        cache: 'pnpm'
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-
    - name: Install dependencies
      run: pnpm install
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
    - name: Build Next.js App
      run: pnpm run build
    - name: Run Playwright tests
      id: playwright-test
      continue-on-error: true
      run: pnpm run test:e2e
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Find Previous Comment
      id: fc
      uses: peter-evans/find-comment@v3
      if: always() && github.event_name == 'pull_request'
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: '### 🤖 E2E テスト (Playwright) が完了しました'
    - name: Post E2E Test Comment
      uses: peter-evans/create-or-update-comment@v4
      if: always() && github.event_name == 'pull_request'
      with:
        comment-id: ${{ steps.fc.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        edit-mode: replace
        body: |
          ### 🤖 E2E テスト (Playwright) が完了しました

          - **結果:** ${{ steps.playwright-test.outcome == 'success' && '✅ 成功' || '❌ 失敗' }}

          [詳細なHTMLレポートはこちら (要ログイン)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)
          *(上記リンク先の "playwright-report" をダウンロードしてください)*